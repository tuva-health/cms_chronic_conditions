version: 2

seeds:
  - name: cms_chronic_conditions__cms_chronic_conditions_hierarchy
    description: CMS generated grouping of ICD 10 codes into chronic conditions groups
    config:
      database: "{{ var('cms_chronic_conditions_database', var('tuva_database', target.database)) }}"
      schema: |
        {%- if var('cms_chronic_conditions_schema',None) != None -%}{{var('cms_chronic_conditions_schema')}}
        {%- elif var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_chronic_conditions
        {% else %}chronic_conditions{%- endif -%}
      enabled: "{{ var('cms_chronic_conditions_enabled',var('tuva_packages_enabled',True)) }}"
      alias: cms_chronic_conditions_hierarchy
      tags: cms_chronic_conditions
      column_types:
        condition_id: integer
        condition: &string_type |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        condition_column_name: *string_type
        chronic_condition_type: *string_type
        condition_category: *string_type
        additional_logic: &description_type |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(1000) {%- endif -%}
        claims_qualification: *description_type
        inclusion_type: *string_type
        code_system: *string_type
        code: *string_type
