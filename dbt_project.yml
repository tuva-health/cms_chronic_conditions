name: 'cms_chronic_conditions'
version: '1.0.0'
config-version: 2
require-dbt-version: ">=1.10.5,<3.0.0"
profile: 'default'


vars:
    pharmacy_claim: >
        {% if var('cms_chronic_conditions_pharmacy_claim_override',none) is not none %}{{var('cms_chronic_conditions_pharmacy_claim_override')}}
        {%- elif var('core_pharmacy_claim_override',none) is not none %}{{var('core_pharmacy_claim_override')}}
        {%- else %}{{ref('core__pharmacy_claim')}}
        {%- endif %}
    encounter: >
        {% if var('cms_chronic_conditions_encounter_override',none) is not none %}{{var('cms_chronic_conditions_encounter_override')}}
        {%- elif var('core_encounter_override',none) is not none %}{{var('core_encounter_override')}}
        {%- else %}{{ref('core__encounter')}}
        {%- endif %}
    condition: >
        {% if var('cms_chronic_conditions_condition_override',none) is not none %}{{var('cms_chronic_conditions_condition_override')}}
        {%- elif var('core_condition_override',none) is not none %}{{var('core_condition_override')}}
        {%- else %}{{ref('core__condition')}}
        {%- endif %}
    procedure: >
        {% if var('cms_chronic_conditions_procedure_override',none) is not none %}{{var('cms_chronic_conditions_procedure_override')}}
        {%- elif var('core_procedure_override',none) is not none %}{{var('core_procedure_override')}}
        {%- else %}{{ref('core__procedure')}}
        {%- endif %}
    patient: >
        {% if var('cms_chronic_conditions_patient_override',none) is not none %}{{var('cms_chronic_conditions_patient_override')}}
        {%- elif var('core_patient_override',none) is not none %}{{var('core_patient_override')}}
        {%- else %}{{ref('core__patient')}}
        {%- endif %}  
  
  


model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
    - "target"

seeds:
    cms_chronic_conditions:
        cms_chronic_conditions__cms_chronic_conditions_hierarchy:
            +post-hook: "{{ the_tuva_project.load_package_seed('cms-chronic-conditions', cms_chronic_conditions.get_cms_chronic_conditions_package_version(), 'cms_chronic_conditions__cms_chronic_conditions_hierarchy.csv.gz') }}"
